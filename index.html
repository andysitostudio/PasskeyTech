<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>PasskeyTech</title>
<style>
:root{--spring:cubic-bezier(.34,1.56,.64,1);--ac:#6fd3ff;--blur:22px;--g1:#1e3a8a;--g2:#0e7490;--g3:#7c3aed;--tx:#f2f7ff;--mute:#b3c4d6;--bad:#ff9a9a;--edge:rgba(255,255,255,.3)}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:#08121f;color:var(--tx);font:var(--fs,15px)/1.45 Bahnschrift,"Segoe UI",sans-serif}
.bg{position:fixed;inset:-40px;z-index:-1;transition:transform .7s ease-out}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.8;animation:float 20s ease-in-out infinite alternate;transition:background 1s}
.bg i:nth-child(1){width:55vw;height:55vw;left:-8vw;top:-14vw;background:var(--g1)}
.bg i:nth-child(2){width:48vw;height:48vw;right:-10vw;top:10vh;background:var(--g2);animation-delay:-7s}
.bg i:nth-child(3){width:42vw;height:42vw;left:28vw;bottom:-18vw;background:var(--g3);animation-delay:-13s}
@keyframes float{to{transform:translate3d(7vw,5vh,0) scale(1.18)}}
.glass{position:relative;border-radius:var(--r,22px);border:1px solid var(--edge);backdrop-filter:blur(var(--blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);
background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.2),transparent 62%),linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.35)}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 12px;margin:4px 0 12px;transition:border-color .2s,box-shadow .2s,background .2s}
select option{background:#14232e}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}
button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 14px;cursor:pointer;transition:transform .3s var(--spring),background .2s,box-shadow .2s}
button:hover{background:rgba(255,255,255,.2);transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.25)}
button:active{transform:scale(.95)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.main{background:var(--ac);color:#08121f;border-color:transparent;font-weight:700}
button.del{color:var(--bad)}
label{color:var(--mute);font-size:13px}
h1,h2{margin:0 0 4px}
.sub{margin:0 0 16px;color:var(--mute)}
.center{height:100%;display:grid;place-items:center}
.card{width:380px;padding:30px;text-align:center}
.card label,.card input,.card .row{text-align:left}
.logo{width:76px;margin:0 auto 10px;animation:bob 4s ease-in-out infinite alternate;filter:drop-shadow(0 10px 18px rgba(80,140,255,.5))}
.logo svg{display:block}.logo.sm{width:34px;margin:0;animation:none;filter:none}
@keyframes bob{to{transform:translateY(-7px) rotate(-3deg)}}
.in{animation:pop .55s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.msg{min-height:20px;margin:0 0 8px;color:var(--bad)}.msg.ok{color:#9af0c0}
.app{display:grid;grid-template-columns:300px 1fr;gap:14px;height:100%;padding:14px}
.side{padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.side input{margin:0}
.list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px}
.it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;cursor:pointer;transition:background .2s,transform .35s var(--spring);animation:pop .45s var(--spring) both;animation-delay:calc(var(--i,0)*35ms)}
.it:hover{background:rgba(255,255,255,.12);transform:translateX(4px)}.it.on{background:rgba(255,255,255,.2)}
.it small{display:block;color:var(--mute)}
.av{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#08121f;background:linear-gradient(135deg,var(--ac),#fff)}
.ed{padding:24px 28px;overflow:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=number]{width:72px;margin:0}.row input[type=checkbox]{width:auto;margin:0}
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin:-6px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s,background .4s}
.empty{color:var(--mute);padding:60px 20px;text-align:center}
.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(4,10,18,.45);animation:pop .25s both}
.modal{width:420px;max-width:92vw;padding:26px;max-height:90vh;overflow:auto}
.otp{width:100%;font:700 26px/1.2 Consolas,monospace;letter-spacing:.12em;margin:4px 0 8px;padding:12px}
.modal ol,.modal ul{margin:4px 0 14px;padding-left:20px;line-height:1.6}
button:disabled{opacity:.45;pointer-events:none}
.legaltxt{white-space:pre-wrap;max-height:48vh;overflow:auto;font-size:13px;line-height:1.55;padding:14px;border-radius:12px;background:rgba(0,0,0,.28)}
.modal.wide{width:780px}
#app{transition:filter .25s;view-transition-name:screen}body.away #app{filter:blur(18px) saturate(.6)}
body.real{background:transparent!important}body.real .bg{opacity:.35}
.out{animation:out .28s ease-in forwards}@keyframes out{to{opacity:0;transform:scale(1.07);filter:blur(10px)}}
button.main{position:relative;overflow:hidden}button.main::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}button.main:hover::after{transform:translateX(120%)}
::view-transition-old(screen){animation:vtout .28s ease both}
::view-transition-new(screen){animation:vtin .5s var(--spring) both}
@keyframes vtout{to{opacity:0;transform:scale(1.05);filter:blur(10px)}}
@keyframes vtin{from{opacity:0;transform:scale(.95) translateY(14px);filter:blur(10px)}}
body.reduce *,body.reduce *::before,body.reduce *::after{animation-duration:.001s!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.12s!important}
body.reduce .bg{transform:none!important}body.reduce .toast{animation:none!important}
.sw{width:30px;height:30px;padding:0;border-radius:50%}.sw.on{outline:2px solid #fff;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:26px;z-index:9;padding:11px 20px;border-radius:999px;animation:toast 2.6s both;transform:translateX(-50%)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
body.noanim *,body.noanim *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="bg"><i></i><i></i><i></i></div><div id="app"></div><script src="legal.js"></script><script src="renderer.js"></script></body>
</html>
